# СИГНАЛЫ — проверка и сборка.
# Каждый пуш: сборка редактора и приложения, сквозная проверка в Chromium, сборка APK.
# Пуш в main: ещё и релиз build-<номер> с APK и редактором.
name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SG_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: |
          npm ci
          echo "SG_VERSION_NAME=$(node -p "require('./package.json').version").${{ github.run_number }}" >> $GITHUB_ENV

      - name: Сборка редактора и приложения
        run: |
          npm run build
          node tools/build-term.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Центр сети (Java)
        run: node tests/net-test.mjs

      - name: Сквозная проверка (Chromium)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet pillow
          npx playwright install --with-deps chromium > /dev/null
          node tests/sstv-test.mjs
          node tests/e2e.mjs playwright shots
          node tests/net-e2e.mjs playwright shots
          node tests/terminal-test.mjs playwright
          node tests/stand-test.mjs playwright shots
          node tests/mech-e2e.mjs playwright shots

      - name: Снимки проверки
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: shots
          path: shots
          if-no-files-found: ignore

      - name: Сборка APK
        env:
          # Подпись: из секретов репозитория, если заданы; иначе — общий ключ из android/keystore.
          SG_KEYSTORE_B64: ${{ secrets.SG_KEYSTORE_B64 }}
          SG_KEYSTORE_PASSWORD_SECRET: ${{ secrets.SG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SG_KEYSTORE_B64" ]; then
            echo "$SG_KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/signaly.jks
            echo "SG_KEYSTORE_FILE=$RUNNER_TEMP/signaly.jks" >> $GITHUB_ENV
            echo "SG_KEYSTORE_PASSWORD=$SG_KEYSTORE_PASSWORD_SECRET" >> $GITHUB_ENV
          else
            echo "SG_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/keystore/signaly-public.jks" >> $GITHUB_ENV
            echo "SG_KEYSTORE_PASSWORD=Wj4gubNloejgY3o3QA48E2ET" >> $GITHUB_ENV
          fi
          echo "SG_KEY_ALIAS=signaly" >> $GITHUB_ENV
      - name: Модель голоса — кэш
        uses: actions/cache@v4
        with:
          path: .vosk
          key: vosk-model-small-ru-0.22

      - name: Модель голоса (Vosk, малая русская, Apache-2.0) → assets/model-ru
        run: |
          mkdir -p .vosk
          [ -s .vosk/model.zip ] || curl -sSL --retry 3 -o .vosk/model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          rm -rf android/app/src/main/assets/model-ru /tmp/vm && mkdir -p /tmp/vm android/app/src/main/assets
          unzip -q -o .vosk/model.zip -d /tmp/vm
          mv /tmp/vm/vosk-model-small-ru-0.22 android/app/src/main/assets/model-ru
          echo "vosk-model-small-ru-0.22" > android/app/src/main/assets/model-ru/uuid
          du -sh android/app/src/main/assets/model-ru

      - name: Gradle
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../dist/signaly-$SG_VERSION_NAME.apk
          ls -la ../dist

      - name: Файлы сборки
        uses: actions/upload-artifact@v5
        with:
          name: signaly-${{ env.SG_VERSION_NAME }}
          path: |
            dist/*.apk
            dist/editor.html
            dist/stand.html

      - name: Релиз
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/editor.html "dist/signaly-editor-$SG_VERSION_NAME.html"
          cp dist/stand.html "dist/signaly-stand-$SG_VERSION_NAME.html"
          # тестовый пакет и QR из сквозной проверки — чтобы сразу попробовать на телефоне
          cp /tmp/sg-net/net-test.sgpack dist/test-net-pack.sgpack
          gh release create "build-${{ github.run_number }}" \
            "dist/signaly-$SG_VERSION_NAME.apk" \
            "dist/signaly-editor-$SG_VERSION_NAME.html" \
            "dist/signaly-stand-$SG_VERSION_NAME.html" \
            dist/test-net-pack.sgpack \
            --title "СИГНАЛЫ $SG_VERSION_NAME" \
            --notes "Приложение для Android (APK), редактор пакетов и стенд телефонов (оба — открыть в Chrome). П25: шпионаж текстом — программа «ПЕРЕХВАТ» (функция «Перехват (шпионаж)»; настройка — «Сеть и события» → «Шпионаж»): речь другого телефона приходит текстом, фразы кодов подсвечены, перегрев; у жертвы — глитчи 0/1, «Проверка линии» и прервать. В test-net-pack: тестировщик 555555 — «ПЕРЕХВАТ», коды прослушки 7101 (Инженер), «УХО МЕДИКА» (Медик), 7103, 7104; «Проверка линии» — ЛИНИЯ или настройки 0000; прервать — РАЗРЫВ или встряхнуть 3 раза. Мини-игра «два выбора голосом» (редактор — вкладка «Мини-игры»; в пакете — коды GAME и GAME2, пульт → «ИГРА» → «МИНИ-ИГРЫ»). Взлом — вкладка «ВЗЛОМ»: ловля волны на шкале, экран цели размыт и читается полосой; у цели — полоса, 0/1, «не те буквы»; защита — встряхнуть 3 раза или ЩИТ. Сбои BITS (0/1) и TYPO (не те буквы). Что проверить — «ЗАМЕТКИ» тестировщика, раздел 0."
