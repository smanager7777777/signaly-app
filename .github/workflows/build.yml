# СИГНАЛЫ — проверка и сборка.
# Каждый пуш: сборка редактора и приложения, сквозная проверка в Chromium, сборка APK.
# Пуш в main: ещё и релиз build-<номер> с APK и редактором.
name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SG_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: |
          npm ci
          echo "SG_VERSION_NAME=$(node -p "require('./package.json').version").${{ github.run_number }}" >> $GITHUB_ENV

      - name: Сборка редактора и приложения
        run: |
          npm run build
          node tools/build-term.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Центр сети (Java)
        run: node tests/net-test.mjs

      - name: Сквозная проверка (Chromium)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet pillow
          npx playwright install --with-deps chromium > /dev/null
          node tests/sstv-test.mjs
          node tests/e2e.mjs playwright shots
          node tests/net-e2e.mjs playwright shots
          node tests/terminal-test.mjs playwright

      - name: Снимки проверки
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: shots
          path: shots
          if-no-files-found: ignore

      - name: Сборка APK
        env:
          # Подпись: из секретов репозитория, если заданы; иначе — общий ключ из android/keystore.
          SG_KEYSTORE_B64: ${{ secrets.SG_KEYSTORE_B64 }}
          SG_KEYSTORE_PASSWORD_SECRET: ${{ secrets.SG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SG_KEYSTORE_B64" ]; then
            echo "$SG_KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/signaly.jks
            echo "SG_KEYSTORE_FILE=$RUNNER_TEMP/signaly.jks" >> $GITHUB_ENV
            echo "SG_KEYSTORE_PASSWORD=$SG_KEYSTORE_PASSWORD_SECRET" >> $GITHUB_ENV
          else
            echo "SG_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/keystore/signaly-public.jks" >> $GITHUB_ENV
            echo "SG_KEYSTORE_PASSWORD=Wj4gubNloejgY3o3QA48E2ET" >> $GITHUB_ENV
          fi
          echo "SG_KEY_ALIAS=signaly" >> $GITHUB_ENV
      - name: Модель голоса — кэш
        uses: actions/cache@v4
        with:
          path: .vosk
          key: vosk-model-small-ru-0.22

      - name: Модель голоса (Vosk, малая русская, Apache-2.0) → assets/model-ru
        run: |
          mkdir -p .vosk
          [ -s .vosk/model.zip ] || curl -sSL --retry 3 -o .vosk/model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          rm -rf android/app/src/main/assets/model-ru /tmp/vm && mkdir -p /tmp/vm android/app/src/main/assets
          unzip -q -o .vosk/model.zip -d /tmp/vm
          mv /tmp/vm/vosk-model-small-ru-0.22 android/app/src/main/assets/model-ru
          echo "vosk-model-small-ru-0.22" > android/app/src/main/assets/model-ru/uuid
          du -sh android/app/src/main/assets/model-ru

      - name: Gradle
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../dist/signaly-$SG_VERSION_NAME.apk
          ls -la ../dist

      - name: Файлы сборки
        uses: actions/upload-artifact@v5
        with:
          name: signaly-${{ env.SG_VERSION_NAME }}
          path: |
            dist/*.apk
            dist/editor.html

      - name: Релиз
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/editor.html "dist/signaly-editor-$SG_VERSION_NAME.html"
          # тестовый пакет и QR из сквозной проверки — чтобы сразу попробовать на телефоне
          cp /tmp/sg-net/net-test.sgpack dist/test-net-pack.sgpack
          gh release create "build-${{ github.run_number }}" \
            "dist/signaly-$SG_VERSION_NAME.apk" \
            "dist/signaly-editor-$SG_VERSION_NAME.html" \
            dist/test-net-pack.sgpack \
            --title "СИГНАЛЫ $SG_VERSION_NAME" \
            --notes "Приложение для Android (APK) и редактор пакетов (открыть в Chrome). П17: тестировщик — вход 555555 (Психолог): в «Заметках» список «что проверить» — сначала новое в этой сборке, потом всё приложение. Новое: запасной центр — копия игры на каждом телефоне, пульт мастера → «СЕТЬ» → «ЗАПАСНОЙ ЦЕНТР» → «Поднять центр отсюда» (если центр пропал), «Выгрузить / Загрузить состояние»; старый центр, вернувшись, уступает сам; телефоны и терминал находят новый центр сами. События телефона и в фоне (служба Android): у правила «когда работает» (всегда / при включённом экране / при выключенном), новое — «не в приложении дольше N с» (Пилот 333333: свернуть на 10 с — Медику уведомление). Скрытые блоки, приборы и программы — только кодом (SECRET, CAM, SPY или голосом «шпион на связи»). Сеть: test-net-pack.sgpack — входы 111111 (инженер: анонимно «?» и отложенно «⏱»), 222222 (медик), 333333 (пилот), 444444 (связист), мастер 98765432; на телефоне мастера включите точку доступа, мастерский код → «Пульт мастера (сеть)» → «Запустить центр», остальные телефоны подключите к точке — после входа они сами находят центр (П14; запасной путь — QR «СЕТЬ» кнопкой «СКАНЕР QR» на экране входа); терминал — Twine СИГНАЛЫ (окно «Сеть», Ctrl+Shift+N); коды AMP1, BOX8, DOOR (две подписи), ALARM1/ALOFF, GL1, NOTE, 7001, BADGE-A. Голос (Vosk, офлайн; режим мастера → «Голос: проверка и замер»): 111111 — всегда в фоне, ключевой телефон («императив блок второй» / «оба», «слава лидеру второй» / «оба»), 222222 — при разблокированном экране, 333333 — по кнопке 🎙; у всех «императив блок» → сбой системы, снять — сказать или набрать «слава лидеру»; «внимание экипаж» — только на одном телефоне, раз в минуту; цифры голосом: «четыре два четыре два». П9: в фоновых режимах 🎙 не видно; «сигнал терминалу» — фраза для терминала (слышит любой телефон, на телефоне ничего; терминал Twine СИГНАЛЫ, движок 28, получает её); инженер 111111 — сотрудник №1 терминала; в окне «Голос: проверка» — «Модель не знает: …». П13: общие переменные терминала и телефонов — в test-net-pack блок «Реактор» показывает {{power}} (энергия, начально 5) и шлюз; код POW+ прибавляет 1, POWQ отвечает текущим значением; правило «энергия ≥ 8» — уведомление всем; пульт → «ИГРА» → «ОБЩИЕ ПЕРЕМЕННЫЕ» (записать, −1/+1); терминал Twine (движок 31) меняет $power сам. П14: шапка — квадратики «ЭНЕРГИЯ» и «ШЛЮЗ», нажатие на шапку — сводка; код GATE срабатывает, только если энергия ≥ 8 и шлюз открыт, иначе «нет доступа» и какое условие не выполнено. П15: коды OPEN / SHUT — шлюз да/нет; энергия не выходит за 0…10 (POW+ при 10 — уведомление «РЕАКТОР ЗАРЯЖЕН ПОЛНОСТЬЮ»), ниже 3 — шкала красная и мигает; «НАГРЕВ» — 30 черточек по ширине экрана, HEAT+ трижды — больше 30, перегрузка (первая черточка сбоит), HEAT0 — сброс; CORE — «код пока не активен», HIDDEN — как неверный код; в главе 2 (код 55555) — своя вторая строка шапки; цифры своей клавиатуры подсвечиваются при нажатии. П16: уведомления с {{имя}} — число подставляет центр (было «Теперь {{power}}» в шторке); НАГРЕВ больше 30 — сбоит столько черточек, на сколько превышено; «ЗАРЯД» — слои: код CHG+ (+5): 1…10 обычный, 11…20 янтарный, 21…30 сбоят, 31…40 свечение, выше 40 не поднимается, CHG0 — сброс; в шапке нажатие на имя — досье, на главу — окно главы, на показатель — сведения о нём; пульт → «ТЕЛЕФОНЫ»: пакет (старый — предупреждение), заряд, голос, связь, последняя фраза; «ПРОБА ГОЛОСА» — всё распознанное со всех телефонов, свободное распознавание; пароли голосом разной длины: «апельсин», «синий ключ», «капитан», «зелёный апельсин лежит в траве», «красная звезда горит над северным отсеком», «код доступа семь три девять», «медленно и тихо открывается старая дверь», «зелёный апельсин лежит в траве и готовится быть съеденным мной сегодня»; у Инженера 111111 — события телефона: встряхнуть — «Встряхиваний» +1 и сигнал, экраном вниз — вспышка 2 раза, экран заблокирован дольше 2 с — Медику уведомление и вспышка, снимок камерой — «Встряхиваний» = 100. П12: сброс прогресса больше не возвращает старые чаты. Коммит ${GITHUB_SHA::7}."
