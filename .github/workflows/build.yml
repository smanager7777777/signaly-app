# СИГНАЛЫ — проверка и сборка.
# Каждый пуш: сборка редактора и приложения, сквозная проверка в Chromium, сборка APK.
# Пуш в main: ещё и релиз build-<номер> с APK и редактором.
name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SG_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: |
          npm ci
          echo "SG_VERSION_NAME=$(node -p "require('./package.json').version").${{ github.run_number }}" >> $GITHUB_ENV

      - name: Сборка редактора и приложения
        run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Центр сети (Java)
        run: node tests/net-test.mjs

      - name: Сквозная проверка (Chromium)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet pillow
          npx playwright install --with-deps chromium > /dev/null
          node tests/sstv-test.mjs
          node tests/e2e.mjs playwright shots
          node tests/net-e2e.mjs playwright shots

      - name: Снимки проверки
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: shots
          path: shots
          if-no-files-found: ignore

      - name: Сборка APK
        env:
          # Подпись: из секретов репозитория, если заданы; иначе — общий ключ из android/keystore.
          SG_KEYSTORE_B64: ${{ secrets.SG_KEYSTORE_B64 }}
          SG_KEYSTORE_PASSWORD_SECRET: ${{ secrets.SG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SG_KEYSTORE_B64" ]; then
            echo "$SG_KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/signaly.jks
            echo "SG_KEYSTORE_FILE=$RUNNER_TEMP/signaly.jks" >> $GITHUB_ENV
            echo "SG_KEYSTORE_PASSWORD=$SG_KEYSTORE_PASSWORD_SECRET" >> $GITHUB_ENV
          else
            echo "SG_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/keystore/signaly-public.jks" >> $GITHUB_ENV
            echo "SG_KEYSTORE_PASSWORD=Wj4gubNloejgY3o3QA48E2ET" >> $GITHUB_ENV
          fi
          echo "SG_KEY_ALIAS=signaly" >> $GITHUB_ENV
      - name: Gradle
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../dist/signaly-$SG_VERSION_NAME.apk
          ls -la ../dist

      - name: Файлы сборки
        uses: actions/upload-artifact@v5
        with:
          name: signaly-${{ env.SG_VERSION_NAME }}
          path: |
            dist/*.apk
            dist/editor.html

      - name: Релиз
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/editor.html "dist/signaly-editor-$SG_VERSION_NAME.html"
          # тестовый пакет и QR из сквозной проверки — чтобы сразу попробовать на телефоне
          cp /tmp/sg-e2e/ТЕСТ-v2.sgpack dist/test-pack.sgpack
          cp /tmp/sg-e2e/qr.jpg dist/test-qr-4242.jpg
          cp /tmp/sg-e2e/sstv.wav dist/test-sstv-robot36.wav
          cp /tmp/sg-net/net-test.sgpack dist/test-net-pack.sgpack
          gh release create "build-${{ github.run_number }}" \
            "dist/signaly-$SG_VERSION_NAME.apk" \
            "dist/signaly-editor-$SG_VERSION_NAME.html" \
            dist/test-pack.sgpack dist/test-qr-4242.jpg dist/test-sstv-robot36.wav dist/test-net-pack.sgpack \
            --title "СИГНАЛЫ $SG_VERSION_NAME" \
            --notes "Приложение для Android (APK) и редактор пакетов (открыть в Chrome). Для пробы: test-pack.sgpack — входы 111111 (инженер) и 222222 (медик), мастер 9999, коды 4242 и 55555 (глава 2); test-qr-4242.jpg — QR для сканера; test-sstv-robot36.wav — пример звука SSTV для терминала (на телефонах приёма нет). Сеть: test-net-pack.sgpack — входы 111111 (инженер: анонимно «?» и отложенно «⏱»), 222222 (медик), 333333 (пилот), 444444 (связист), мастер 98765432; на телефоне мастера включите точку доступа, мастерский код → «Пульт мастера (сеть)» → «Запустить центр», остальные телефоны подключите к точке и сканируют QR «СЕТЬ» кнопкой «СКАНЕР QR» на экране входа; коды AMP1, BOX8, DOOR (две подписи), ALARM1/ALOFF, GL1, NOTE, 7001, BADGE-A. Коммит ${GITHUB_SHA::7}."
